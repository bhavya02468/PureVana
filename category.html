<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Category | Purevana International LLP</title>
  <meta
    name="description"
    content="Browse Purevana International LLP business categories and product details."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-topbar">
    <div class="container hero-shell">
      <nav class="navbar">
        <a class="brand" href="index.html" aria-label="Purevana home">
          <img src="assets/purevana-logo.png" alt="Purevana">
        </a>
        <input id="nav-toggle" class="nav-toggle" type="checkbox" aria-label="Toggle navigation">
        <label class="nav-burger" for="nav-toggle">
          <span></span>
          <span></span>
          <span></span>
        </label>
        <div class="nav-menu">
          <a href="index.html">Home</a>
          <a href="about.html">About Us</a>
          <a class="active" href="categories.html">Business Categories</a>
          <a href="contact.html">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="section section-light category-page-shell">
      <div class="container">
        <div class="page-flow">
          <a href="categories.html">Business Categories</a>
          <span>/</span>
          <strong id="category-crumb">Category</strong>
        </div>

        <section class="category-hero-card">
          <div class="category-hero-copy">
            <p class="category-eyebrow" id="category-eyebrow">Business Category</p>
            <h1 id="category-title">Category Name</h1>
            <p class="category-description" id="category-description">
              Category description goes here.
            </p>
           
          </div>
          <div class="category-hero-visual">
            <div class="category-hero-icon-wrap" id="category-hero-visual-wrap">
              <img id="category-hero-image" alt="Category product preview">
              <i id="category-icon" class="fa-solid fa-box"></i>
            </div>
          </div>
        </section>

        <section class="category-highlights-grid" id="category-highlights"></section>

        <section class="category-items-shell">
          <div class="section-title left">
            <h2 id="items-title">Available Range</h2>
            <span></span>
          </div>
          <div class="category-items-grid" id="category-items"></div>
        </section>
      </div>
    </section>
  </main>

  <button id="scroll-to-top" class="scroll-to-top" type="button" aria-label="Back to top" hidden>
    <i class="fa-solid fa-arrow-up"></i>
    <span>Top</span>
  </button>

  <dialog class="image-lightbox" id="image-lightbox" aria-label="Product image preview">
    <button class="image-lightbox-close" type="button" aria-label="Close image preview">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="image-lightbox-image" alt="">
  </dialog>

  <script src="herb-data.js"></script>
  <script src="bagasse-data.js"></script>
  <script src="category-data.js"></script>
  <script>
    const query = new URLSearchParams(window.location.search);
    const slug = query.get("slug") || "ayurvedic-herbal-products";
    const categories = window.categoryCatalog || [];
    const herbs = window.herbCatalog || [];
    const bagasse = window.bagasseCatalog || [];
    const category = categories.find((item) => item.slug === slug) || categories[0];
    const itemsRoot = document.getElementById("category-items");
    const imageLightbox = document.getElementById("image-lightbox");
    const imageLightboxImage = document.getElementById("image-lightbox-image");
    const scrollToTopButton = document.getElementById("scroll-to-top");

    window.addEventListener("scroll", () => {
      scrollToTopButton.hidden = window.scrollY < 240;
    });

    scrollToTopButton.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    itemsRoot.addEventListener("click", (event) => {
      const image = event.target.closest(".catalog-image img");
      if (!image) return;

      imageLightboxImage.src = image.currentSrc || image.src;
      imageLightboxImage.alt = image.alt;
      imageLightbox.showModal();
    });

    imageLightbox.querySelector(".image-lightbox-close").addEventListener("click", () => {
      imageLightbox.close();
    });

    imageLightbox.addEventListener("click", (event) => {
      if (event.target === imageLightbox) imageLightbox.close();
    });

    if (category) {
      document.title = `${category.name} | Purevana International LLP`;
      document.querySelector('meta[name="description"]').setAttribute("content", category.description);
      document.getElementById("category-crumb").textContent = category.name;
      document.getElementById("category-eyebrow").textContent = category.eyebrow;
      document.getElementById("category-title").textContent = category.name;
      document.getElementById("category-description").textContent = category.description;
      document.getElementById("category-icon").className = `fa-solid ${category.icon}`;
      const heroImage = document.getElementById("category-hero-image");
      const heroIcon = document.getElementById("category-icon");
      const heroWrap = document.getElementById("category-hero-visual-wrap");

      if (category.heroImage) {
        heroImage.src = category.heroImage;
        heroImage.alt = category.name;
        heroImage.addEventListener("load", () => {
          heroWrap.classList.add("with-image");
          heroIcon.style.display = "none";
        });
        heroImage.addEventListener("error", () => {
          heroWrap.classList.remove("with-image");
          heroIcon.style.display = "";
        });
      }

      const highlightRoot = document.getElementById("category-highlights");
      category.highlights.forEach((highlight) => {
        const article = document.createElement("article");
        article.className = "category-highlight-card";
        article.innerHTML = `
          <strong>${highlight.title}</strong>
          <p>${highlight.text}</p>
        `;
        highlightRoot.appendChild(article);
      });

        if (category.itemsType === "herbs") {
          document.getElementById("items-title").textContent = "Ayurvedic Herb Catalogue";
          herbs.forEach((herb) => {
            const herbCardImage = herb.catalogImage || `${herb.imageBase}/main.jpg`;
            const card = document.createElement("article");
            card.className = "catalog-card static";
            card.innerHTML = `
              <div class="catalog-image">
              <img src="${herbCardImage}" alt="${herb.name}">
              </div>
              <div class="catalog-copy">
                <p class="catalog-meta">${herb.scientific}</p>
                <h3>${herb.name}</h3>
              <p>${herb.description}</p>
              <a class="card-cta" href="herb.html?slug=${herb.slug}">View Details &rarr;</a>
            </div>
          `;
          const img = card.querySelector("img");
          img.addEventListener("error", () => {
            card.querySelector(".catalog-image").innerHTML = `<div class="catalog-fallback"><i class="fa-solid ${herb.icon}"></i></div>`;
          });
          itemsRoot.appendChild(card);
        });
      } else if (category.itemsType === "bagasse") {
        document.getElementById("items-title").textContent = "Bagasse Product Categories";
        bagasse.forEach((product) => {
          const card = document.createElement("article");
          card.className = "catalog-card static";
          card.innerHTML = `
            <div class="catalog-image">
              <img src="${product.imageBase}/main.jpg" alt="${product.name}">
            </div>
            <div class="catalog-copy">
              <p class="catalog-meta">${product.category}</p>
              <h3>${product.name}</h3>
              <a class="card-cta" href="bagasse.html?slug=${product.slug}">View Details &rarr;</a>
            </div>
          `;
          const img = card.querySelector("img");
          img.addEventListener("error", () => {
            card.querySelector(".catalog-image").innerHTML = `<div class="catalog-fallback"><i class="fa-solid ${product.icon}"></i></div>`;
          });
          itemsRoot.appendChild(card);
        });
      } else {
        document.getElementById("items-title").textContent = "Available Range";
        (category.items || []).forEach((item) => {
          const article = document.createElement("article");
          article.className = item.image ? "catalog-card static" : "catalog-card compact";
          article.innerHTML = item.image
            ? `
              <div class="catalog-image">
                <img src="${item.image}" alt="${item.name}">
              </div>
              <div class="catalog-copy">
                <h3>${item.name}</h3>
                <a class="card-cta" href="contact.html#enquiry">Request Details &rarr;</a>
              </div>
            `
            : `
              <div class="catalog-copy">
                <p class="catalog-meta">${category.name}</p>
                <h3>${item.name}</h3>
                <a class="card-cta" href="contact.html#enquiry">Request Details &rarr;</a>
              </div>
            `;
          const img = article.querySelector("img");
          if (img) {
            img.addEventListener("error", () => {
              article.querySelector(".catalog-image").innerHTML = `<div class="catalog-fallback"><i class="fa-solid ${category.icon}"></i></div>`;
            });
          }
          itemsRoot.appendChild(article);
        });
      }
    }
  </script>
</body>
</html>
