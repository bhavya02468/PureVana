<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Purevana International LLP</title>
  <meta
    name="description"
    content="Contact Purevana International LLP for sourcing, import, export and business category enquiries."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-topbar">
    <div class="container hero-shell">
      <nav class="navbar">
        <a class="brand" href="index.html" aria-label="Purevana home">
          <img src="assets/purevana-logo.png" alt="Purevana">
        </a>
        <input id="nav-toggle" class="nav-toggle" type="checkbox" aria-label="Toggle navigation">
        <label class="nav-burger" for="nav-toggle">
          <span></span>
          <span></span>
          <span></span>
        </label>
        <div class="nav-menu">
          <a href="index.html">Home</a>
          <a href="about.html">About Us</a>
          <a href="categories.html">Business Categories</a>
          <a class="active" href="contact.html">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="section section-light">
      <div class="container contact-grid">
        <div class="info-panel">
          <div class="section-title left">
            <h2>Get In Touch</h2>
            <span></span>
          </div>
          <div class="contact-detail">
            <i class="fa-solid fa-location-dot"></i>
            <div>
              <strong>Office Address</strong>
              <p>E-56, Sector-63, Noida - 201301, Uttar Pradesh, India</p>
            </div>
          </div>
          <div class="contact-detail">
            <i class="fa-solid fa-phone"></i>
            <div>
              <strong>Phone</strong>
              <p>+91 8882995519</p>
            </div>
          </div>
          <div class="contact-detail">
            <i class="fa-solid fa-envelope"></i>
            <div>
              <strong>Email</strong>
              <p>purevanaindia.com</p>
            </div>
          </div>
          <div class="contact-detail">
            <i class="fa-solid fa-globe"></i>
          </div>
        </div>

        <div class="enquiry-panel" id="enquiry">
          <div class="section-title left">
            <h2>Send An Enquiry</h2>
            <span></span>
          </div>
          <form class="enquiry-form">
            <div class="form-row">
              <input type="text" placeholder="Your Name">
              <input type="text" placeholder="Company Name">
            </div>
            <div class="form-row">
              <input type="email" placeholder="Email Address">
              <input type="text" placeholder="Phone Number">
            </div>
            <div class="form-row">
              <input type="text" placeholder="Country">
              <input type="text" placeholder="Product Required">
            </div>
            <textarea rows="6" placeholder="Tell us about your requirement"></textarea>
            <button class="btn btn-gold wide" type="submit">Submit Enquiry <span>&rarr;</span></button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer removed (kept only on About Us page) -->
</body>
</html>
