<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Purevana International LLP</title>
  <meta
    name="description"
    content="Contact Purevana International LLP for sourcing, import, export and business category enquiries."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-topbar">
    <div class="container hero-shell">
      <nav class="navbar">
        <a class="brand" href="index.html" aria-label="Purevana home">
          <img src="assets/purevana-logo.png" alt="Purevana">
        </a>
        <input id="nav-toggle" class="nav-toggle" type="checkbox" aria-label="Toggle navigation">
        <label class="nav-burger" for="nav-toggle">
          <span></span>
          <span></span>
          <span></span>
        </label>
        <div class="nav-menu">
          <a href="index.html">Home</a>
          <a href="about.html">About Us</a>
          <a href="categories.html">Business Categories</a>
          <a class="active" href="contact.html">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    
    <section class="section contact-section">
      <div class="container contact-grid">
        <aside class="contact-info-card">
          <h2 class="section-title left">GET IN TOUCH
            <span></span>
          </h2>

          <div class="contact-detail">
            <span class="contact-icon"><i class="fa-solid fa-location-dot"></i></span>
            <div>
              <strong>Visit us</strong>
              <address>E-56, Sector-63, Noida-201301, Distt. Gautam Buddha Nagar,  Uttar Pradesh, India </address>
            </div>
          </div>
          <div class="contact-detail">
            <span class="contact-icon"><i class="fa-solid fa-envelope"></i></span>
            <div>
              <strong>Email us</strong>
              <a href="mailto:info@purevanaint.com">info@purevanaint.com</a>
              <a href="mailto:purevanaindia@gmail.com">purevanaindia@gmail.com</a>
            </div>
          </div>
        </aside>

        <div class="enquiry-panel" id="enquiry">
          <h2 class="section-title left">SEND AN ENQUIRY
            <span></span>
          </h2>
          <form class="enquiry-form" action="mailto:info@purevanaint.com" method="post" enctype="text/plain">
            <div class="form-row">
              <div class="form-field">
                <label for="name">Your name <span aria-hidden="true">*</span></label>
                <input id="name" name="name" type="text" autocomplete="name" required placeholder="Your Name">
              </div>
              <div class="form-field">
                <label for="company">Company name</label>
                <input id="company" name="company" type="text" autocomplete="organization" placeholder="Company Name">
              </div>
            </div>
            <div class="form-row country-phone-row">
              <div class="form-field">
                <label for="country">Country</label>
                <select id="country" name="country" autocomplete="country-name">
                  <option value="">Select country</option>
                  <option value="Australia" data-code="+61">Australia (+61)</option>
                  <option value="Argentina" data-code="+54">Argentina (+54)</option>
                  <option value="Bangladesh" data-code="+880">Bangladesh (+880)</option>
                  <option value="Belgium" data-code="+32">Belgium (+32)</option>
                  <option value="Brazil" data-code="+55">Brazil (+55)</option>
                  <option value="Canada" data-code="+1">Canada (+1)</option>
                  <option value="China" data-code="+86">China (+86)</option>
                  <option value="Denmark" data-code="+45">Denmark (+45)</option>
                  <option value="Egypt" data-code="+20">Egypt (+20)</option>
                  <option value="France" data-code="+33">France (+33)</option>
                  <option value="Germany" data-code="+49">Germany (+49)</option>
                  <option value="Hong Kong" data-code="+852">Hong Kong (+852)</option>
                  <option value="India" data-code="+91">India (+91)</option>
                  <option value="Indonesia" data-code="+62">Indonesia (+62)</option>
                  <option value="Ireland" data-code="+353">Ireland (+353)</option>
                  <option value="Italy" data-code="+39">Italy (+39)</option>
                  <option value="Japan" data-code="+81">Japan (+81)</option>
                  <option value="Kenya" data-code="+254">Kenya (+254)</option>
                  <option value="Malaysia" data-code="+60">Malaysia (+60)</option>
                  <option value="Mexico" data-code="+52">Mexico (+52)</option>
                  <option value="Netherlands" data-code="+31">Netherlands (+31)</option>
                  <option value="New Zealand" data-code="+64">New Zealand (+64)</option>
                  <option value="Nigeria" data-code="+234">Nigeria (+234)</option>
                  <option value="Norway" data-code="+47">Norway (+47)</option>
                  <option value="Pakistan" data-code="+92">Pakistan (+92)</option>
                  <option value="Philippines" data-code="+63">Philippines (+63)</option>
                  <option value="Qatar" data-code="+974">Qatar (+974)</option>
                  <option value="Russia" data-code="+7">Russia (+7)</option>
                  <option value="Saudi Arabia" data-code="+966">Saudi Arabia (+966)</option>
                  <option value="Singapore" data-code="+65">Singapore (+65)</option>
                  <option value="South Africa" data-code="+27">South Africa (+27)</option>
                  <option value="South Korea" data-code="+82">South Korea (+82)</option>
                  <option value="Spain" data-code="+34">Spain (+34)</option>
                  <option value="Sri Lanka" data-code="+94">Sri Lanka (+94)</option>
                  <option value="Sweden" data-code="+46">Sweden (+46)</option>
                  <option value="Switzerland" data-code="+41">Switzerland (+41)</option>
                  <option value="Thailand" data-code="+66">Thailand (+66)</option>
                  <option value="Turkey" data-code="+90">Turkey (+90)</option>
                  <option value="United Arab Emirates" data-code="+971">United Arab Emirates (+971)</option>
                  <option value="United Kingdom" data-code="+44">United Kingdom (+44)</option>
                  <option value="United States" data-code="+1">United States (+1)</option>
                  <option value="Vietnam" data-code="+84">Vietnam (+84)</option>
                  <option value="Other" data-code="">Other</option>
                </select>
              </div>
              <div class="form-field">
                <label for="phone">Phone number <span aria-hidden="true">*</span></label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" required placeholder="Phone Number">
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label for="email">Email address <span aria-hidden="true">*</span></label>
                <input id="email" name="email" type="email" autocomplete="email" required placeholder="Email Address">
              </div>
              <div class="form-field">
                <label for="product-category">Product category</label>
                <select id="product-category" name="product_category">
                  <option value="">Select a category</option>
                </select>
              </div>
            </div>
            <div class="form-field">
              <label for="product-option">Subcategory</label>
              <select id="product-option" name="product_option" disabled>
                <option value="">Choose a category first</option>
              </select>
            </div>
            <div class="form-field">
              <label for="message">Your requirement <span aria-hidden="true">*</span></label>
              <textarea id="message" name="message" rows="5" required aria-describedby="message-hint" placeholder="Tell us about your requirement (at least 20 words)"></textarea>
              <small class="field-hint" id="message-hint">Please enter at least 20 words. <span id="word-count">0</span>/20 words</small>
            </div>
            <button class="btn btn-gold wide" type="submit">SUBMIT ENQUIRY <i class="fa-solid fa-arrow-right"></i></button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="category-data.js"></script>
  <script>
    const countrySelect = document.getElementById('country');
    const phoneInput = document.getElementById('phone');
    const productCategory = document.getElementById('product-category');
    const productOption = document.getElementById('product-option');
    const messageInput = document.getElementById('message');
    const wordCount = document.getElementById('word-count');
    const categoryCatalog = window.categoryCatalog || [];

    categoryCatalog.forEach((category) => {
      const option = document.createElement('option');
      option.value = category.slug;
      option.textContent = category.name;
      productCategory.appendChild(option);
    });

    const enquiryParameters = new URLSearchParams(window.location.search);

    countrySelect.addEventListener('change', () => {
      const dialCode = countrySelect.selectedOptions[0].dataset.code || '';
      const previousCode = phoneInput.dataset.dialCode || '';
      const number = previousCode && phoneInput.value.startsWith(previousCode)
        ? phoneInput.value.slice(previousCode.length).trim()
        : phoneInput.value.trim();

      phoneInput.value = dialCode ? `${dialCode}${number ? ` ${number}` : ' '}` : number;
      phoneInput.dataset.dialCode = dialCode;
      phoneInput.placeholder = dialCode ? `${dialCode} Phone Number` : 'Phone Number';
    });

    productCategory.addEventListener('change', () => {
      const category = categoryCatalog.find((item) => item.slug === productCategory.value);
      const choices = category?.items || [];
      productOption.replaceChildren();

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = choices.length ? 'Select a subcategory' : 'Choose a category first';
      productOption.appendChild(placeholder);

      choices.forEach((item) => {
        const option = document.createElement('option');
        option.value = item.name;
        option.textContent = item.name;
        productOption.appendChild(option);
      });

      productOption.disabled = !choices.length;
    });

    const selectedCategory = enquiryParameters.get('category');
    const selectedSubcategory = enquiryParameters.get('subcategory');
    if (selectedCategory && categoryCatalog.some((category) => category.slug === selectedCategory)) {
      productCategory.value = selectedCategory;
      productCategory.dispatchEvent(new Event('change'));
      if (selectedSubcategory && [...productOption.options].some((option) => option.value === selectedSubcategory)) {
        productOption.value = selectedSubcategory;
      }
    }

    messageInput.addEventListener('input', () => {
      const words = messageInput.value.trim() ? messageInput.value.trim().split(/\s+/).length : 0;
      wordCount.textContent = words;
      messageInput.setCustomValidity(words > 0 && words < 20 ? 'Please enter at least 20 words about your requirement.' : '');
    });
  </script>

</body>
</html>
