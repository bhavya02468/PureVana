<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purevana International LLP</title>
  <meta
    name="description"
    content="Purevana International LLP connects global markets through trusted import, export and sourcing services."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="main-hero">
    <!-- Slideshow Background Images -->
    <div class="hero-slideshow">
      <img class="hero-slide active" src="assets/Slide 1.jpeg" alt="Purevana products showcase 1">
      <img class="hero-slide" src="assets/Slide 2.jpeg" alt="Purevana products showcase 2">
      <img class="hero-slide" src="assets/Slide 3.jpeg" alt="Purevana products showcase 3">
      <img class="hero-slide" src="assets/Slide 4.jpeg" alt="Purevana products showcase 4">
      <img class="hero-slide" src="assets/Slide 5.jpeg" alt="Purevana products showcase 5">
      <img class="hero-slide" src="assets/Slide 6.jpeg" alt="Purevana products showcase 6">
      <img class="hero-slide" src="assets/Slide 7.jpeg" alt="Purevana products showcase 7">
      <img class="hero-slide" src="assets/Slide 8.jpeg" alt="Purevana products showcase 8">
      <img class="hero-slide" src="assets/Slide 9.jpeg" alt="Purevana products showcase 9">
      <img class="hero-slide" src="assets/Slide 10.jpeg" alt="Purevana products showcase 10">
      <img class="hero-slide" src="assets/Slide 11.jpeg" alt="Purevana products showcase 11">
      <img class="hero-slide" src="assets/Slide 12.jpeg" alt="Purevana products showcase 12">


      <!-- Add more images here as needed -->
    </div>

    <!-- Dark Overlay -->
    <div class="hero-overlay-dark"></div>

    <!-- Centered Content -->
    <div class="main-hero-shell">
      <div class="main-hero-center">
        <a class="brand-hero" href="index.html" aria-label="Purevana home">
          <img src="assets/purevana-logo.png" alt="Purevana">
        </a>
        <a class="btn btn-outline hero-cta" href="categories.html">Explore →</a>
      </div>
    </div>
  </section>

  <script>
    // Slideshow rotation (add more image paths as needed)
    const slides = document.querySelectorAll('.hero-slide');
    let currentSlide = 0;

    function rotateSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }

    // Change slide more quickly for a livelier hero.
    if (slides.length > 1) {
      setTimeout(() => {
        rotateSlide();
        setInterval(rotateSlide, 3000);
      }, 900);
    }
  </script>
</body>
</html>
